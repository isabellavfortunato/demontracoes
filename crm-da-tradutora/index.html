<style>
/* ----------------------------------------------------------------
   Demonstração do CRM da tradutora.
   Cópia separada da ferramenta de verdade: sem login, sem Firebase,
   sem planilha e sem Drive. Os dados vivem só na memória da página.
   Layout: cabeçalho com abas, faixa de aviso e o quadro de seis
   colunas, exatamente como no sistema original.
   Fonte de sistema e tema claro de propósito, porque é assim que a
   ferramenta de verdade se apresenta.
   ---------------------------------------------------------------- */
:root {
  color-scheme: light;

  --papel: #ffffff;
  --superficie: #f3f4f6;
  --borda: #d8dbe0;
  --texto: #1c1f23;
  --texto-fraco: #5f666e;

  --tinta: #2b4c7e;
  --tinta-clara: #e8eef7;
  --ambar: #8a6114;
  --ambar-clara: #faf1dd;
  --verde: #2f6b4f;
  --verde-clara: #dff0e6;
  --alerta: #a62b2b;
  --alerta-clara: #fbeaea;

  --raio: 4px;

  --fonte-app: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; }

body {
  font-family: var(--fonte-app);
  font-size: 14px;
  line-height: 1.45;
  color: var(--texto);
  background: var(--superficie);
}

.numero { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* ---------- selo de demonstração ---------- */

.topo-dir {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.demo-selo {
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--tinta);
  background: var(--tinta-clara);
  border-radius: 999px;
  padding: 5px 12px;
  white-space: nowrap;
}

.aviso-demo {
  margin: 0;
  font-size: 13px;
  color: var(--texto-fraco);
  background: var(--tinta-clara);
  border-bottom: 1px solid var(--borda);
  padding-block: 7px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

#recomecar { font-size: 13px; padding: 5px 11px; }

/* ---------- cabeçalho da ferramenta ---------- */

.topo {
  display: flex;
  align-items: baseline;
  gap: 24px;
  flex-wrap: wrap;
  background: var(--papel);
  border-bottom: 1px solid var(--borda);
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.topo h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }

.topo nav { display: flex; gap: 18px; flex: 1 1 auto; flex-wrap: wrap; }

.topo nav button {
  border: none;
  background: none;
  padding: 0 0 2px;
  font-size: 14px;
  font-family: inherit;
  color: var(--texto-fraco);
  border-bottom: 2px solid transparent;
  cursor: pointer;
}

.topo nav button:hover { color: var(--texto); }
.topo nav button.ativo { color: var(--texto); border-bottom-color: var(--tinta); }

.quem { color: var(--texto-fraco); font-size: 13px; }

.quem select {
  width: auto;
  padding: 3px 6px;
  font-size: 13px;
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  background: var(--papel);
  color: var(--texto);
}

/* ---------- quadro ---------- */

.quadro {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.coluna {
  flex: 1 1 0;
  min-width: 0;
  background: var(--papel);
  border: 1px solid var(--borda);
  border-radius: var(--raio);
}

.coluna-topo { padding: 10px 12px; border-bottom: 1px solid var(--borda); }
.coluna-topo h2 { margin: 0; font-size: 13px; font-weight: 600; }
.coluna-resumo { color: var(--texto-fraco); font-size: 12px; margin-top: 2px; }

.coluna[data-etapa="faturar_cartorio"] .coluna-topo { border-top: 3px solid var(--ambar); }
.coluna[data-etapa="faturar_traducao"] .coluna-topo { border-top: 3px solid var(--tinta); }
.coluna[data-etapa="faturado"] .coluna-topo { border-top: 3px solid var(--verde); }

.coluna-corpo { padding: 8px; display: flex; flex-direction: column; gap: 8px; }

.cartao {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px;
  background: var(--papel);
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  cursor: grab;
}

.cartao:hover { border-color: var(--tinta); }
.cartao.arrastando { opacity: .4; cursor: grabbing; }

.cartao-link { background: none; border: none; padding: 0; font: inherit; text-align: left; color: inherit; cursor: pointer; display: block; }
.cartao-numero { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 600; font-size: 13px; }
.cartao-cliente { display: block; color: var(--texto-fraco); margin: 2px 0 4px; }
.cartao-valor { display: block; font-size: 13px; }

.selo { font-size: 12px; padding: 1px 6px; border-radius: var(--raio); white-space: nowrap; }
.selo-traducao { background: var(--tinta-clara); color: var(--tinta); }
.selo-cartorio { background: var(--ambar-clara); color: var(--ambar); }
.selo-ok { background: var(--verde-clara); color: var(--verde); }
.selo-parado { background: var(--superficie); color: var(--texto-fraco); }

.vazio { padding: 14px 12px; color: var(--texto-fraco); font-size: 13px; }

select.mover {
  font-size: 12px;
  padding: 3px 6px;
  color: var(--texto-fraco);
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  width: 100%;
}

.coluna.recebendo { background: var(--tinta-clara); }
.coluna.recusando { background: var(--alerta-clara); }

/* ---------- páginas ---------- */

.pagina {
  max-width: 1100px;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.pagina.larga { max-width: none; }

.faixa {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.faixa h1 { margin: 0; font-size: 18px; font-weight: 600; }
.faixa-botoes { display: flex; gap: 8px; flex-wrap: wrap; }

.painel {
  background: var(--papel);
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  padding: 16px;
  margin-bottom: 16px;
}

.painel h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }

label { display: block; margin-bottom: 4px; color: var(--texto-fraco); }

input, select, textarea, button { font-family: inherit; font-size: 14px; }

input, select, textarea {
  width: 100%;
  padding: 7px 9px;
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  background: var(--papel);
  color: var(--texto);
}

input:focus, select:focus, textarea:focus, button:focus-visible, .cartao-link:focus-visible {
  outline: 2px solid var(--tinta);
  outline-offset: -1px;
}

.linha { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.linha > * { flex: 1 1 160px; min-width: 0; }
.linha > .estreito { flex: 0 1 120px; }
.linha > .botao-fim { flex: 0 0 auto; align-self: flex-end; }

button {
  padding: 8px 14px;
  border: 1px solid var(--tinta);
  border-radius: var(--raio);
  background: var(--tinta);
  color: var(--papel);
  cursor: pointer;
}

button:hover { background: #23406c; }
button.secundario { background: var(--papel); color: var(--texto); border-color: var(--borda); }
button.secundario:hover { background: var(--superficie); }
button.discreto { background: none; border: none; color: var(--alerta); padding: 4px 6px; }
button.discreto:hover { background: var(--alerta-clara); }

.campo-busca { position: relative; }

.lista-flutuante {
  position: absolute;
  z-index: 10;
  left: 0; right: 0;
  max-height: 240px;
  overflow-y: auto;
  background: var(--papel);
  border: 1px solid var(--tinta);
  border-top: none;
  border-radius: 0 0 var(--raio) var(--raio);
  box-shadow: 0 4px 10px rgba(28, 31, 35, .08);
}

.opcao { display: flex; justify-content: space-between; gap: 10px; padding: 6px 9px; cursor: pointer; }
.opcao:hover, .opcao.destacada { background: var(--tinta-clara); }

/* ---------- tabelas ---------- */

.rolagem { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; }

th {
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  color: var(--texto-fraco);
  padding: 6px 8px;
  border-bottom: 1px solid var(--borda);
  white-space: nowrap;
}

td { padding: 6px 8px; border-bottom: 1px solid var(--superficie); }
td.direita, th.direita { text-align: right; }
tr[data-categoria="cartorio"] { background: var(--ambar-clara); }

input.na-linha, select.na-linha {
  padding: 3px 6px;
  font-size: 13px;
  text-align: right;
  background: transparent;
  border-color: transparent;
  min-width: 64px;
}

input.na-linha:hover, select.na-linha:hover { border-color: var(--borda); background: var(--papel); }
input.na-linha:focus, select.na-linha:focus { background: var(--papel); }
select.na-linha { text-align: left; }

/* ---------- previsão ---------- */

.previsao { border-left: 3px solid var(--tinta); }
.previsao table td { border: none; padding: 3px 8px; }

.total-linha {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 8px;
  border-top: 1px solid var(--borda);
  font-weight: 600;
}

.repasse { color: var(--texto-fraco); font-weight: 400; }

.divergencia {
  background: var(--alerta-clara);
  border-left: 3px solid var(--alerta);
  padding: 10px 12px;
  border-radius: var(--raio);
  margin-top: 10px;
}

.erro-item { color: var(--alerta); margin: 3px 0; }
.aviso-item { color: var(--ambar); margin: 3px 0; }

textarea.interna { background: #fdf8e8; border-color: #e0d3a8; }
textarea.interna:focus { background: var(--papel); }

/* ---------- nota e documento ---------- */

table.copiavel th { width: 220px; vertical-align: top; color: var(--texto-fraco); font-weight: 400; border-bottom: 1px solid var(--superficie); white-space: normal; }
td.para-copiar { cursor: copy; }
td.para-copiar:hover { background: var(--tinta-clara); }
td.copiada { background: var(--verde-clara); }

.folha {
  background: var(--papel);
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  padding: 28px;
  max-width: 760px;
}

.folha-topo { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--texto); padding-bottom: 10px; margin-bottom: 16px; }
.folha-topo h2 { margin: 0 0 2px; font-size: 17px; }
.folha-topo p { margin: 0; color: var(--texto-fraco); font-size: 13px; }
.folha h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--texto-fraco); margin: 22px 0 8px; }
.folha-pagamento { background: var(--superficie); border-radius: var(--raio); padding: 12px 14px; }
.folha-pagamento p { margin: 0 0 2px; }

.recado {
  background: var(--tinta-clara);
  border-left: 3px solid var(--tinta);
  padding: 10px 12px;
  border-radius: var(--raio);
  margin-bottom: 16px;
}

.recado p { margin: 0; }

.nota-rodape { color: var(--texto-fraco); font-size: 13px; margin-top: 10px; }

@media (max-width: 760px) {
  .quadro { flex-direction: column; }
  .coluna { width: 100%; flex: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<header class="topo">
  <h1>Isabella Fortunato Traduções</h1>
  <nav id="menu"></nav>
  <div class="topo-dir">
    <span class="demo-selo">Demonstração com dados fictícios</span>
    <span class="quem">
      Perfil
      <select id="perfil" aria-label="Perfil de quem está usando">
        <option value="isabella">Isabella</option>
        <option value="gabrielly">Gabrielly</option>
      </select>
    </span>
    <button type="button" class="secundario" id="recomecar">Restaurar exemplo</button>
  </div>
</header>

<p class="aviso-demo" id="status" aria-live="polite">Clientes, serviços e orçamentos são fictícios. As alterações desta demonstração não são salvas e tudo volta ao exemplo quando a página é recarregada.</p>

/* ==================================================================
   Cálculo. É a mesma regra do sistema de verdade.
   ================================================================== */

function arredondar(valor) { return Math.round((Number(valor) + Number.EPSILON) * 100) / 100; }

function calcularDesconto(bruto, desconto, tipo) {
  const d = Number(desconto) || 0;
  if (d <= 0) return 0;
  if (tipo === "valor") return Math.min(d, bruto);
  return arredondar(bruto * Math.min(d, 100) / 100);
}

function recalcularItem(it) {
  const bruto = Number(it.quantidade) * Number(it.valor_unitario);
  const abatido = calcularDesconto(bruto, it.desconto, it.tipo_desconto);
  it.valor_total = arredondar(bruto - abatido);
  return it;
}

function calcularTotais(itens) {
  let geral = 0, desconto = 0, paraTerceiro = 0, reembolsavel = 0;

  for (const it of itens) {
    const bruto = Number(it.quantidade) * Number(it.valor_unitario);
    desconto += calcularDesconto(bruto, it.desconto, it.tipo_desconto);
    geral += Number(it.valor_total);
    if (it.categoria === "cartorio") paraTerceiro += Number(it.valor_total);
    if (it.categoria === "despesa") reembolsavel += Number(it.valor_total);
  }

  return {
    geral: arredondar(geral),
    desconto: arredondar(desconto),
    para_terceiro: arredondar(paraTerceiro),
    reembolsavel: arredondar(reembolsavel),
    receita: arredondar(geral - paraTerceiro - reembolsavel),
  };
}

function separarDocumentos(itens) {
  const documentos = {};
  for (const [nome, categorias] of Object.entries(CATEGORIAS_DO_DOCUMENTO)) {
    const deste = itens.filter(it => categorias.includes(it.categoria));
    if (deste.length) {
      documentos[nome] = { itens: deste, total: arredondar(deste.reduce((s, it) => s + Number(it.valor_total), 0)) };
    }
  }
  return documentos;
}

function montarOrcamento(dados) {
  const o = Object.assign({}, dados);
  o.documentos = separarDocumentos(o.itens);
  o.totais = calcularTotais(o.itens);
  o.etapas = o.etapas || {};
  for (const nome of Object.keys(o.documentos)) {
    if (!o.etapas[nome]) o.etapas[nome] = "proposta";
  }
  for (const nome of Object.keys(o.etapas)) {
    if (!o.documentos[nome]) delete o.etapas[nome];
  }
  return o;
}

function preverColunas(itens) {
  const colunas = { "CARTORIO": 0, "TRADUÇÃO": 0, "Diligência Cartório": 0, "Diligência Envio": 0, "Correio/DHL": 0 };
  const foraDaConta = [];

  for (const it of itens) {
    const valor = Number(it.valor_total) || 0;
    if (it.categoria === "diligencia") {
      if (it.chave_servico === CHAVE_DILIGENCIA_ENVIO) colunas["Diligência Envio"] += valor;
      else if (it.chave_servico === CHAVE_DILIGENCIA_CARTORIO) colunas["Diligência Cartório"] += valor;
      else foraDaConta.push(it);
      continue;
    }
    const destino = CATEGORIA_PARA_COLUNA[it.categoria];
    if (destino) colunas[destino] += valor;
    else foraDaConta.push(it);
  }

  for (const k of Object.keys(colunas)) colunas[k] = arredondar(colunas[k]);

  const somaColunas = arredondar(Object.values(colunas).reduce((a, b) => a + b, 0));
  const somaItens = arredondar(itens.reduce((s, it) => s + (Number(it.valor_total) || 0), 0));

  return { colunas, total_planilha: somaColunas, total_orcamento: somaItens, confere: Math.abs(somaColunas - somaItens) < 0.01, fora: foraDaConta };
}

function direcaoDaTraducao(itens) {
  let porIta = false, itaPor = false;
  for (const it of itens) {
    const d = String(it.descricao || "").trim().toUpperCase();
    if (d.startsWith("POR-ITA")) porIta = true;
    if (d.startsWith("ITA-POR")) itaPor = true;
  }
  if (itaPor) return "ITA-POR";
  if (porIta) return "POR-ITA";
  return "";
}

function validarItens(itens) {
  const erros = [], avisos = [];
  if (!itens.length) return { ok: false, erros: ["O orçamento não tem nenhum item."], avisos };

  itens.forEach((it, i) => {
    const nome = it.descricao || ("item " + (i + 1));
    if (!it.categoria) erros.push(nome + ": sem categoria, então não dá para saber em qual coluna da planilha o valor entraria.");
    if (it.categoria === "diligencia" && ![CHAVE_DILIGENCIA_CARTORIO, CHAVE_DILIGENCIA_ENVIO].includes(it.chave_servico)) {
      erros.push(nome + ": diligência sem definir se é de cartório ou de envio. São colunas diferentes na planilha.");
    }
    if (Number(it.quantidade) <= 0) erros.push(nome + ": quantidade precisa ser maior que zero.");
    if (Number(it.valor_total) < 0) erros.push(nome + ": valor negativo.");
    if (Number(it.valor_total) === 0) avisos.push(nome + ": valor zero. Confirme se é isento mesmo.");

    const bruto = Number(it.quantidade) * Number(it.valor_unitario);
    const abatido = calcularDesconto(bruto, it.desconto, it.tipo_desconto);
    if (it.tipo_desconto === "percentual" && Number(it.desconto) > 100) erros.push(nome + ": desconto passa de cem por cento.");
    if (it.tipo_desconto === "valor" && Number(it.desconto) > bruto) erros.push(nome + ": o desconto é maior que o próprio item.");
    if (bruto && abatido / bruto >= 0.5) avisos.push(nome + ": desconto de " + moeda(abatido) + ", que é metade ou mais do valor do item. Confirme.");
  });

  return { ok: erros.length === 0, erros, avisos };
}

function proximoNumero() {
  const agora = new Date(2026, 9, 18);
  const prefixo = String(agora.getFullYear() % 100).padStart(2, "0") + String(agora.getMonth() + 1).padStart(2, "0");
  const doMes = estado.orcamentos.map(o => o.numero).filter(n => n.startsWith(prefixo));

  return prefixo + String(maior + 1).padStart(3, "0");
}

function escapar(texto) {
  return String(texto == null ? "" : texto)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function salvarRascunho() {
  const r = estado.rascunho;
  const checagem = validarItens(r.itens);

  if (!r.cliente_id) { avisar("Escolha um cliente antes de salvar."); desenhar(); return; }
  if (!checagem.ok) { avisar("Corrija os erros apontados abaixo antes de salvar."); desenhar(); return; }

  const numero = r.numero || proximoNumero();
  const existente = acharOrcamento(numero);

  const dados = {
    numero,
    cliente_id: r.cliente_id,
    entrega: r.entrega,
    parceiro: r.parceiro,
    criado_por: r.criado_por,
    aprovado: existente ? existente.aprovado : false,
    observacoes_cliente: r.observacoes_cliente,
    observacoes_internas: r.observacoes_internas,
    itens: r.itens,
    etapas: existente ? Object.assign({}, existente.etapas) : {},
  };

  const novo = montarOrcamento(dados);

  if (existente) estado.orcamentos[estado.orcamentos.indexOf(existente)] = novo;
  else estado.orcamentos.unshift(novo);

  estado.rascunho = { ...r, numero };
  avisar("Orçamento " + numero + " salvo. Na ferramenta de verdade, é agora que a linha entraria na planilha Status clientes.");
  desenhar();
}

      <div class="faixa">
        <h1>Faturamento de parceiros</h1>
      </div>

      ${estado.recado ? `<div class="recado"><p>${escapar(estado.recado)}</p></div>` : ""}

      <section class="painel">
        <div class="linha">
          <div>
            <label for="sel-parceiro">Parceiro</label>
            <select id="sel-parceiro" data-campo-fatura="parceiroEscolhido">
              ${PARCEIROS.map(p => `<option value="${escapar(p)}" ${p === parceiro ? "selected" : ""}>${escapar(p)}</option>`).join("")}
            </select>
          </div>
          <div class="estreito">
            <label for="sel-mes">Mês</label>
            <select id="sel-mes" data-campo-fatura="mesEscolhido">
              <option value="2026-09" ${mes === "2026-09" ? "selected" : ""}>Setembro 2026</option>
              <option value="2026-10" ${mes === "2026-10" ? "selected" : ""}>Outubro 2026</option>
            </select>
          </div>
          <div class="botao-fim"><button type="button" data-gerar-fatura="1">Gerar fatura</button></div>
        </div>
      </section>

      <section class="painel">
        <h2>Entram na fatura</h2>
        ${dentro.length ? `
        <div class="rolagem">
          <table>
            <thead><tr><th>Número</th><th>Cliente</th><th>Entrega</th><th class="direita">Valor da tradução</th></tr></thead>
            <tbody>
              ${dentro.map(o => `<tr>
                <td class="numero">${o.numero}</td>
                <td>${escapar((acharCliente(o.cliente_id) || {}).nome || "")}</td>
                <td>${dataBonita(o.entrega)}</td>
                <td class="direita numero">${moeda(o.documentos.traducao ? o.documentos.traducao.total : 0)}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div class="total-linha"><span>Total da fatura</span><span class="numero">${moeda(total)}</span></div>
        ` : `<p class="vazio">Nenhum orçamento aprovado deste parceiro neste mês.</p>`}
      </section>

      <section class="painel">
        <h2>Fora da fatura</h2>
        ${fora.length ? `
        <div class="rolagem">
          <table>
            <thead><tr><th>Número</th><th>Cliente</th><th>Motivo</th></tr></thead>
            <tbody>
              ${fora.map(o => `<tr>
                <td class="numero">${o.numero}</td>
                <td>${escapar((acharCliente(o.cliente_id) || {}).nome || "")}</td>
                <td>Ainda em proposta, sem aprovação</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>` : `<p class="vazio">Nada de fora neste mês.</p>`}
      </section>
    </div>
  `;
}

/* ==================================================================
   Desenho e eventos
   ================================================================== */

const TELAS = {
  quadro: telaQuadro,
  orcamento: telaOrcamento,
  documento: telaDocumento,
  nota: telaNota,
  clientes: telaClientes,
  cliente: telaCliente,
  servicos: telaServicos,
  faturamento: telaFaturamento,
};

function desenhar() {
  desenharMenu();
  document.getElementById("perfil").value = estado.perfil;
  document.getElementById("tela").innerHTML = (TELAS[estado.tela] || telaQuadro)();
  ligarArrastar();
}

/* ----- busca de serviço por digitação ----- */

function sugerir(texto) {
  const caixa = document.getElementById("sugestoes");
  if (!caixa) return;

  const termo = texto.trim().toLowerCase();
  if (!termo) { caixa.innerHTML = ""; return; }

  const achados = estado.servicos
    .filter(s => s.ativo && s.descricao.toLowerCase().includes(termo))
    .slice(0, 8);

  caixa.innerHTML = achados.length
    ? `<div class="lista-flutuante">${achados.map(s => `
        <div class="opcao" data-escolher="${s.id}">
          <span>${escapar(s.descricao)}</span>
          <span class="numero">${moeda(s.preco)}</span>
        </div>`).join("")}</div>`
    : `<div class="lista-flutuante"><div class="opcao">Nenhum serviço com esse texto.</div></div>`;
}

function escolherServico(id) {
  const s = estado.servicos.find(x => x.id === id);
  if (!s) return;
  document.getElementById("busca-servico").value = s.descricao;
  document.getElementById("busca-servico").dataset.escolhido = s.id;
  document.getElementById("unitario").value = s.preco;
  document.getElementById("sugestoes").innerHTML = "";
  document.getElementById("qtd").focus();
}

function adicionarItem() {
  const campo = document.getElementById("busca-servico");
  const id = campo.dataset.escolhido;
  const s = estado.servicos.find(x => x.id === id);

  if (!s) { avisar("Escolha um serviço da lista antes de adicionar."); desenhar(); return; }

  const quantidade = Number(document.getElementById("qtd").value) || 1;
  const unitario = Number(document.getElementById("unitario").value) || 0;
  const desconto = Number(document.getElementById("desconto").value) || 0;
  const tipo = document.getElementById("tipo-desconto").value;

  const novo = {
    chave_servico: s.chave, descricao: s.descricao, categoria: s.categoria,
    quantidade, valor_unitario: unitario, desconto, tipo_desconto: tipo, valor_total: 0,
  };

  estado.rascunho.itens.push(recalcularItem(novo));
  desenhar();
  document.getElementById("busca-servico").focus();
}

function adicionarDespesa() {
  const descricao = document.getElementById("desc-despesa").value.trim();
  const valor = Number(document.getElementById("valor-despesa").value) || 0;

  if (!descricao) { avisar("Escreva do que é a despesa, para ela aparecer no orçamento do cliente."); desenhar(); return; }

  estado.rascunho.itens.push(despesa(descricao, valor));
  desenhar();
}

/* ----- arrastar cartões ----- */

let arrastando = null;

function ligarArrastar() {
  document.querySelectorAll('.cartao[draggable="true"]').forEach(cartao => {
    cartao.addEventListener("dragstart", () => {
      arrastando = cartao;
      cartao.classList.add("arrastando");
    });
    cartao.addEventListener("dragend", () => {
      cartao.classList.remove("arrastando");
      document.querySelectorAll(".coluna").forEach(c => c.classList.remove("recebendo", "recusando"));
      arrastando = null;
    });
  });

  document.querySelectorAll(".coluna").forEach(coluna => {
    coluna.addEventListener("dragover", e => {
      if (!arrastando) return;
      e.preventDefault();
      const aceita = ETAPAS_PERMITIDAS[arrastando.dataset.documento].includes(coluna.dataset.etapa);
      coluna.classList.toggle("recebendo", aceita);
      coluna.classList.toggle("recusando", !aceita);
    });
    coluna.addEventListener("dragleave", () => coluna.classList.remove("recebendo", "recusando"));
    coluna.addEventListener("drop", e => {
      e.preventDefault();
      coluna.classList.remove("recebendo", "recusando");
      if (!arrastando) return;
      moverEtapa(arrastando.dataset.numero, arrastando.dataset.documento, coluna.dataset.etapa);
    });
  });
}

/* ----- cliques ----- */

document.addEventListener("click", e => {
  const alvo = e.target.closest("[data-ir],[data-novo],[data-abrir],[data-salvar],[data-adicionar],[data-adicionar-despesa],[data-remover],[data-escolher],[data-cliente],[data-ativar],[data-documento],[data-nota],[data-voltar-orcamento],[data-gerar-fatura],[data-copiar]");
  if (!alvo) return;

  const d = alvo.dataset;

  if (d.ir) { ir(d.ir); return; }
  if (d.novo) { abrirOrcamento(null); return; }
  if (d.abrir) { abrirOrcamento(d.abrir); return; }
  if (d.salvar) { salvarRascunho(); return; }
  if (d.adicionar) { adicionarItem(); return; }
  if (d.adicionarDespesa) { adicionarDespesa(); return; }
  if (d.remover) { estado.rascunho.itens.splice(Number(d.remover), 1); desenhar(); return; }
  if (d.escolher) { escolherServico(d.escolher); return; }
  if (d.cliente) { ir("cliente", { numeroAberto: d.cliente }); return; }
  if (d.documento) { ir("documento", { numeroAberto: estado.rascunho.numero, documentoAberto: d.documento }); return; }
  if (d.nota) { ir("nota", { numeroAberto: estado.rascunho.numero, documentoAberto: d.nota }); return; }
  if (d.voltarOrcamento) { abrirOrcamento(d.voltarOrcamento); return; }

  if (d.ativar) {
    const s = estado.servicos.find(x => x.id === d.ativar);
    if (s) s.ativo = !s.ativo;
    desenhar();
    return;
  }

  if (d.gerarFatura) {
    const dentro = estado.orcamentos.filter(o => o.parceiro === estado.parceiroEscolhido && (o.entrega || "").startsWith(estado.mesEscolhido) && o.aprovado);
    const total = arredondar(dentro.reduce((s, o) => s + (o.documentos.traducao ? o.documentos.traducao.total : 0), 0));
    avisar(dentro.length
      ? `Fatura de ${estado.parceiroEscolhido} montada com ${dentro.length} orçamento(s), somando ${moeda(total)}. Na ferramenta de verdade sairiam agora o arquivo em Word e o PDF, a partir do modelo de fatura.`
      : `Não há orçamento aprovado de ${estado.parceiroEscolhido} neste mês, então não há fatura a gerar.`);
    desenhar();
    return;
  }

  if (d.copiar !== undefined) {
    const texto = d.copiar;
    const celula = alvo;
    const aviso = document.getElementById("aviso-copia");

    const marcar = () => {
      celula.classList.add("copiada");
      if (aviso) aviso.textContent = "Copiado.";
      setTimeout(() => celula.classList.remove("copiada"), 1200);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(marcar).catch(() => {
        const faixa = document.createRange();
        faixa.selectNodeContents(celula);
        const selecao = window.getSelection();
        selecao.removeAllRanges();
        selecao.addRange(faixa);
        if (aviso) aviso.textContent = "O navegador não deixou copiar sozinho. O texto já está selecionado, use Command mais C.";
      });
    } else {
      const faixa = document.createRange();
      faixa.selectNodeContents(celula);
      const selecao = window.getSelection();
      selecao.removeAllRanges();
      selecao.addRange(faixa);
      if (aviso) aviso.textContent = "O texto está selecionado, use Command mais C.";
    }
  }
});

/* ----- digitação e seleção ----- */

document.addEventListener("input", e => {
  const d = e.target.dataset;

  if (e.target.id === "busca-servico") { delete e.target.dataset.escolhido; sugerir(e.target.value); return; }

  if (d.campo && estado.rascunho) { estado.rascunho[d.campo] = e.target.value; return; }

  if (d.editar !== undefined) {
    const it = estado.rascunho.itens[Number(d.indice)];
    if (!it) return;
    it[d.editar] = d.editar === "tipo_desconto" ? e.target.value : Number(e.target.value);
    recalcularItem(it);
    const foco = { editar: d.editar, indice: d.indice };
    desenhar();
    const volta = document.querySelector(`[data-editar="${foco.editar}"][data-indice="${foco.indice}"]`);
    if (volta) { volta.focus(); if (volta.select) volta.select(); }
    return;
  }

  if (d.preco) {
    const s = estado.servicos.find(x => x.id === d.preco);
    if (s) s.preco = Number(e.target.value) || 0;
    return;
  }

  if (d.clienteCampo) {
    const c = acharCliente(estado.numeroAberto);
    if (c) c[d.clienteCampo] = e.target.value;
    return;
  }

  if (d.enderecoCampo) {
    const c = acharCliente(estado.numeroAberto);
    if (c) c.endereco[d.enderecoCampo] = e.target.value;
    return;
  }
});

document.addEventListener("change", e => {
  const d = e.target.dataset;

  if (e.target.id === "perfil") { estado.perfil = e.target.value; desenhar(); return; }

  if (e.target.classList.contains("mover") && e.target.value) {
    const cartao = e.target.closest(".cartao");
    moverEtapa(cartao.dataset.numero, cartao.dataset.documento, e.target.value);
    return;
  }

  if (d.campoFatura) { estado[d.campoFatura] = e.target.value; estado.recado = ""; desenhar(); return; }

  if (d.campo && estado.rascunho) { estado.rascunho[d.campo] = e.target.value; desenhar(); return; }
});

const botaoRecomecar = document.getElementById("recomecar");

botaoRecomecar.addEventListener("click", () => {
  if (botaoRecomecar.dataset.ok !== "1") {
    botaoRecomecar.dataset.ok = "1";
    botaoRecomecar.textContent = "Confirmar: apagar alterações";
    setTimeout(() => {
      botaoRecomecar.dataset.ok = "";
      botaoRecomecar.textContent = "Restaurar exemplo";
    }, 4000);
    return;
  }
  botaoRecomecar.dataset.ok = "";
  botaoRecomecar.textContent = "Restaurar exemplo";
  comecar();
  desenhar();
});

comecar();
desenhar();
</script>
